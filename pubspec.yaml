name: diario_do_bebe
description: Diario do bebe — registro da rotina com um toque, notificacao fixa na tela de bloqueio.
publish_to: "none"
version: 1.3.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  flutter_foreground_task: ^9.2.2
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  fl_chart: ^0.69.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Ícone do app (lua/estrelas), gerado na build pela CI.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon/app_icon.png"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "icon/app_icon_foreground.png"
