name: Build APK

# Gera o arquivo do app (APK) a cada push na main e a cada tag de versao.
# O resultado fica em duas formas:
#  - "Artifacts" da execucao (sempre): baixar dali enquanto testa.
#  - "Releases" (quando voce cria uma tag tipo v1.0.1): link fixo pra instalar.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar estrutura Android
        run: flutter create --platforms=android --org com.rideblan --project-name diario_do_bebe .

      - name: Injetar permissoes e servico no manifesto
        run: python3 tool/patch_android.py

      - name: Dependencias
        run: flutter pub get

      - name: Gerar icone do app
        run: dart run flutter_launcher_icons

      - name: Build do APK (release)
        run: flutter build apk --release

      - name: Renomear APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/diario-do-bebe.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: diario-do-bebe-apk
          path: dist/diario-do-bebe.apk

      - name: Publicar release (so em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/diario-do-bebe.apk
